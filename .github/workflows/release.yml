name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet apm-cli==0.31.0
      - name: Pack release artifacts
        run: |
          set -euo pipefail
          apm marketplace check
          apm pack --check-versions --check-clean --dry-run
          for package in plugins/*/; do
            (
              cd "$package"
              apm pack --offline --archive --archive-format tar.gz -o "$GITHUB_WORKSPACE/dist"
            )
          done
          cp .claude-plugin/marketplace.json "dist/marketplace-${GITHUB_REF_NAME}.json"
          shasum -a 256 dist/* > dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "StudyU Agent Marketplace ${GITHUB_REF_NAME}" \
            --generate-notes
