name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet apm-cli==0.31.0
      - run: bash scripts/validate.sh
      - run: apm marketplace check
      - name: Verify committed marketplace catalogs
        run: |
          set -euo pipefail
          apm pack --offline
          git diff --exit-code -- .claude-plugin/marketplace.json .agents/plugins/marketplace.json
      - name: Verify release packaging
        uses: microsoft/apm-action@v1
        with:
          mode: release
          release-skip-publish: "true"
          apm-version: "0.31.0"
      - name: Smoke-test direct APM installs
        shell: bash
        run: |
          set -euo pipefail
          consumer=$(mktemp -d)
          mkdir -p "$consumer/.opencode"
          cat > "$consumer/apm.yml" <<EOF
          name: apm-smoke-test
          version: 0.0.0
          targets: [claude, copilot, cursor, codex, gemini, grok-build, opencode, windsurf, kiro, antigravity, hermes, agent-skills]
          dependencies:
            apm:
              - $PWD/plugins/studyu-skills
              - $PWD/plugins/dart
          EOF
          cd "$consumer"
          apm install --verbose
          for dir in .agents/skills .claude/skills .kiro/skills .grok/skills; do
            for skill in asd-ste100 dependency-upgrade flutter-platform-regeneration manual-testing pull-request; do
              [ -f "$dir/$skill/SKILL.md" ] || { echo "missing $dir/$skill/SKILL.md" >&2; exit 1; }
            done
          done
          for f in .mcp.json opencode.json .github/mcp.json .codex/config.toml .cursor/mcp.json .gemini/settings.json .kiro/settings/mcp.json; do
            grep -q dart "$f" || { echo "missing dart in $f" >&2; exit 1; }
          done
          apm audit --ci
      - name: Scan history for secrets
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks && ./gitleaks git --redact -v
