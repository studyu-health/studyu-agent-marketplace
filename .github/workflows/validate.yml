name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet apm-cli==0.31.0
      - run: bash scripts/validate.sh
      - name: Verify skills CLI discovery
        shell: bash
        run: |
          output=$(DISABLE_TELEMETRY=1 npx --yes skills@1.7.0 add . --list)
          printf '%s\n' "$output"
          for dir in skills/*/; do
            name=${dir#skills/}; name=${name%/}
            grep -q "$name" <<<"$output"
          done
      - name: Smoke-test APM install
        shell: bash
        run: |
          set -euo pipefail
          consumer=$(mktemp -d)
          cat > "$consumer/apm.yml" <<EOF
          name: apm-smoke-test
          version: 0.0.0
          targets: [claude, opencode, copilot, codex, cursor]
          dependencies:
            apm:
              - $PWD
              - $PWD/mcps/dart
          EOF
          cd "$consumer"
          apm install --verbose
          for dir in .agents/skills .claude/skills; do
            for skill in asd-ste100 dependency-upgrade flutter-platform-regeneration manual-testing pull-request; do
              [ -f "$dir/$skill/SKILL.md" ] || { echo "missing $dir/$skill/SKILL.md" >&2; exit 1; }
            done
          done
          for f in .mcp.json opencode.json .github/mcp.json .codex/config.toml .cursor/mcp.json; do
            grep -q dart "$f" || { echo "missing dart in $f" >&2; exit 1; }
          done
          apm audit
      - name: Scan history for secrets
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks && ./gitleaks git --redact -v
