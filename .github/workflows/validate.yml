name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: bash scripts/validate.sh
      - name: Verify skills CLI discovery
        shell: bash
        run: |
          output=$(DISABLE_TELEMETRY=1 npx --yes skills@1.7.0 add . --list)
          printf '%s\n' "$output"
          for dir in skills/*/; do
            name=${dir#skills/}; name=${name%/}
            grep -q "$name" <<<"$output"
          done
      - name: Scan history for secrets
        run: curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks && ./gitleaks git --redact -v
