name: sonarqube
version: 0.1.0
description: SonarQube MCP server (opt-in; run `apm install -g` to add it to your own agents)
author: StudyU
license: MIT
includes: auto
dependencies:
  apm: []
  mcp:
    - name: sonarqube
      registry: false
      transport: stdio
      command: sonar
      args: ["run", "mcp"]
